x-backup: &backup
  GRAPHDB_BACKUP_S3_BUCKET: ${GRAPHDB_BACKUP_S3_BUCKET:?Set the backup bucket}
  GRAPHDB_BACKUP_S3_PREFIX: ${GRAPHDB_BACKUP_S3_PREFIX:-graphdb-ha-backups}
  GRAPHDB_BACKUP_S3_ENDPOINT: ${GRAPHDB_BACKUP_S3_ENDPOINT:-}
  GRAPHDB_BACKUP_S3_REGION: ${GRAPHDB_BACKUP_S3_REGION:-us-east-1}
  GRAPHDB_BACKUP_S3_PATH_STYLE: ${GRAPHDB_BACKUP_S3_PATH_STYLE:-false}
  GRAPHDB_BACKUP_S3_ACCESS_KEY_ID: ${GRAPHDB_BACKUP_S3_ACCESS_KEY_ID:-}
  GRAPHDB_BACKUP_S3_SECRET_ACCESS_KEY: ${GRAPHDB_BACKUP_S3_SECRET_ACCESS_KEY:-}
  GRAPHDB_BACKUP_S3_SESSION_TOKEN: ${GRAPHDB_BACKUP_S3_SESSION_TOKEN:-}

services:
  node1:
    environment:
      <<: *backup
  node2:
    environment:
      <<: *backup
  node3:
    environment:
      <<: *backup
