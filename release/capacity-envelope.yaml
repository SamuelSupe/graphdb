schema_version: 1
release: "1.2"
scope: per_tenant

correctness_concurrency_gate:
  writers: 8
  required_outcomes:
    lost_commits: 0
    duplicate_versions: 0

postgres_cas_gate:
  active_writers_per_tenant: 2
  target_commits_per_second: 20
  duration: 30m
  minimum_throughput_ratio: 0.90
  server_cas_replays_per_request: 8
  client_write_conflict_retries: 64
  client_retry_backoff_max: 2s
  client_retry_routing: load_balanced_across_writers
  compact_commit_tail_threshold: 1000
  write_backpressure_commit_tail: 1500
  maximum_maintenance_interval: 30s
  required_outcomes:
    lost_commits: 0
    duplicate_versions: 0
    terminal_errors: 0

compatibility_gate:
  data_upgrade_from: v1.1.5
  reverse_compatibility_required: false

local_wal_ingest_gate:
  host:
    runtime: orbstack
    platform: linux/arm64
    cpu_limit: 8
    memory_limit_bytes: 8589934592
  topology:
    writers: 1
    coordination: local
    tenants: 8
    collectors: 16
    writer_pipelines_per_tenant: 32
  workload:
    logical_groups_per_batch: 200
    mutations_per_group: 3
    working_set_groups_per_tenant: 20000
  duration: 30m
  valid_runs: 5
  maximum_run_throughput_variation: 0.05
  minimum_committed_mutations_per_second: 10000
  minimum_throughput_ratio_vs_v1_1_5: 1.50
  accepted_latency:
    p95_max: 20ms
    p99_max: 250ms
  committed_latency:
    p95_max: 8s
    p99_max: 15s
  maximum_rss_bytes: 7516192768
  maximum_rss_ratio_vs_v1_1_5: 1.10
  maximum_cpu_per_1000_mutations_ratio_vs_v1_1_5: 0.75
  overload:
    response_status: 429
    retry_after_required: true
    queue_high_watermark_percent: 80
    wal_high_watermark_percent: 70
    wal_stop_watermark_percent: 85
    maximum_pending_age: 20s

query_contract:
  maximum_result_limit: 1000

topology_contract:
  local_coordination:
    writers_per_tenant: 1
  postgres_coordination:
    minimum_writers_per_tenant: 2
    maximum_writers_per_tenant: 8
    object_store_provider: generic-s3

notes:
  - This is a release gate, not a maximum supported graph size.
  - The local WAL gate uses sync durability and segment metadata on one fixed OrbStack host.
  - All five local WAL runs must pass; any failed absolute, relative, latency, RSS, CPU, or variation threshold blocks release.
  - Eight deployed writers are supported, but the sustained hot-tenant throughput gate uses two active contenders.
  - Client retries rotate across writers to verify cluster-wide idempotency instead of relying on process affinity.
  - Larger commit rates or graph sizes require a target-environment baseline.
