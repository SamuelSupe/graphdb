schema_version: 2
edition: local_disk
version: 2.0.0
status: performance_unqualified
report: docs/performance-v2.0.md
runtime_revision: d90e554c
toolchain: go1.26.7
scope: single_process_multi_tenant

topology:
  processes_per_data_directory: 1
  storage: local_disk
  coordination: local
  mode: all
  concurrent_write_clients: 4
  concurrent_query_clients: 16

persistence:
  authority: immutable_parquet_files_and_manifest
  directory_ownership: exclusive_process_file_lock
  default_ingest: direct
  default_wal_durability: sync
  accepted_wal: durable_202_before_publication
  status: /v1/ingest/batches/{source}/{collector_id}/{batch_id}
  lifecycle: fencing_wins_over_unpublished_wal
  physical_volume_loss: outside_contract

comparison:
  baseline_revision: 5632cd82
  cases: [previous_local, v2_local]
  entities: [10002, 100002]
  ingest_modes: [direct, wal]
  warmup: 1m
  measurement: 2m
  direct_scope: 10002_entities_20s_warmup_60s_measurement
  repetitions: 1
  repeat_only_to_investigate_regressions: true
  minimum_mixed_throughput_improvement: 0.10
  minimum_cold_p95_improvement: 0.10
  maximum_other_latency_regression: 0.05
  maximum_peak_rss_regression: 0.10

correctness:
  soak_duration: 30m
  background: [compact, gc, index_rebuild]
  lost_confirmed_writes: 0
  duplicate_replayed_versions: 0
  data_format: v2_fresh_directory
  cross_major_migration: unsupported
  maximum_query_result_limit: 1000
