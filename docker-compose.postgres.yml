services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: graphdb
      POSTGRES_USER: graphdb
      POSTGRES_PASSWORD: graphdb
    ports:
      - "${GRAPHDB_POSTGRES_PORT:-35432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphdb -d graphdb"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - graphdb-postgres-data:/var/lib/postgresql/data

volumes:
  graphdb-postgres-data:
