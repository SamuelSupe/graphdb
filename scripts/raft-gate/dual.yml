services:
  gateway:
    ports: !override ["127.0.0.1:46080:8080"]
  node1:
    networks:
      default: {}
      raft:
        aliases: [raft-node1]
    ports: !override ["127.0.0.1:36081:8080", "127.0.0.1:39081:8081"]
    environment:
      GRAPHDB_RAFT_PEERS: '{"1":"http://raft-node1:8081","2":"http://raft-node2:8081","3":"http://raft-node3:8081"}'
      GRAPHDB_RAFT_SNAPSHOT_ENTRIES: "5"
      GRAPHDB_INGEST_MODE: "wal"
      GRAPHDB_INGEST_FLUSH_INTERVAL: "200ms"
  node2:
    networks:
      default: {}
      raft:
        aliases: [raft-node2]
    ports: !override ["127.0.0.1:36082:8080", "127.0.0.1:39082:8081"]
    environment:
      GRAPHDB_RAFT_PEERS: '{"1":"http://raft-node1:8081","2":"http://raft-node2:8081","3":"http://raft-node3:8081"}'
      GRAPHDB_RAFT_SNAPSHOT_ENTRIES: "5"
      GRAPHDB_INGEST_MODE: "wal"
      GRAPHDB_INGEST_FLUSH_INTERVAL: "200ms"
  node3:
    networks:
      default: {}
      raft:
        aliases: [raft-node3]
    ports: !override ["127.0.0.1:36083:8080", "127.0.0.1:39083:8081"]
    environment:
      GRAPHDB_RAFT_PEERS: '{"1":"http://raft-node1:8081","2":"http://raft-node2:8081","3":"http://raft-node3:8081"}'
      GRAPHDB_RAFT_SNAPSHOT_ENTRIES: "5"
      GRAPHDB_INGEST_MODE: "wal"
      GRAPHDB_INGEST_FLUSH_INTERVAL: "200ms"

networks:
  raft:
    internal: true
