            small_file_object_threshold:
              type: integer
            small_file_bytes_threshold:
              type: integer
            entity_page_split_threshold:
              type: integer
            entity_page_merge_threshold:
              type: integer
            edge_shard_split_threshold:
              type: integer
            edge_shard_merge_threshold:
