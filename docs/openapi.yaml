        route:
          type: string
        remote_addr:
          type: string
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        canceled:
          type: boolean
        request:
          $ref: '#/components/schemas/QueryRequest'
    EntityPage:
