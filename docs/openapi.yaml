openapi: 3.0.3
info:
  title: GraphDB Internal API
  version: 1.0.0
  description: Internal object-store backed multi-tenant graph database API.
servers:
  - url: http://localhost:8080
security:
  - TenantHeader: []
paths:
  /openapi.yaml:
    get:
      security: []
      summary: Fetch this OpenAPI contract.
      responses:
        '200':
          description: OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string
  /v1/commits:
    post:
      summary: Apply an atomic direct mutation commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Commit applied, skipped by md5, or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/WriteBackpressure'
  /v1/ingest/batches:
    post:
      summary: Apply a collector ingestion batch with idempotency and partial failure reporting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Batch accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '207':
          description: Batch accepted with item failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/WriteBackpressure'
  /v1/query:
    post:
      summary: Execute the JSON query DSL.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/query/stream:
    post:
      summary: Execute a query and stream newline-delimited JSON pages.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/query/gql:
    post:
      summary: Execute a text GQL query compiled to the JSON query DSL.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GQLQueryRequest'
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/query/gql/stream:
    post:
      summary: Execute a text GQL query and stream newline-delimited JSON pages.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GQLQueryRequest'
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/queries/running:
    get:
      summary: List running queries for the tenant on this process.
      responses:
        '200':
          description: Running queries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunningQuery'
  /v1/queries/running/{query_id}:
    delete:
      summary: Cancel a running query on this process.
      parameters:
        - name: query_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query cancellation requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  killed:
                    type: boolean
                  query:
                    $ref: '#/components/schemas/RunningQuery'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants:
    get:
      summary: List tenants.
      parameters:
        - name: include_legacy
          in: query
          required: false
          schema:
            type: boolean
          description: Scan legacy tenant prefixes when true; default lists only lifecycle-managed tenants.
      responses:
        '200':
          description: Tenant list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantInfo'
    post:
      summary: Create or materialize tenant metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRequest'
      responses:
        '200':
          description: Tenant created or already present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/tenant-usage:
    get:
      summary: Report tenant object count, bytes, and retention policy.
      responses:
        '200':
          description: Tenant usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUsage'
  /v1/tenants/{tenant_id}:
    get:
      summary: Get tenant status and metadata.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Replace tenant display metadata.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRequest'
      responses:
        '200':
          description: Tenant metadata updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
    delete:
      summary: Soft delete a tenant.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant marked deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
  /v1/tenants/{tenant_id}/disable:
    post:
      summary: Disable tenant writes.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
  /v1/tenants/{tenant_id}/enable:
    post:
      summary: Re-enable a disabled or soft-deleted tenant.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
  /v1/tenants/{tenant_id}/purge:
    post:
      summary: Permanently delete all objects under a tenant prefix.
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: force
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Tenant purge report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPurgeReport'
  /v1/tenants/{tenant_id}/clone:
    post:
      summary: Clone a tenant current snapshot into a new tenant.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCloneRequest'
      responses:
        '202':
          description: Tenant cloned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
  /v1/tenants/{tenant_id}/backup:
    post:
      summary: Start a tenant backup task.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '202':
          description: Tenant backup task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/tenants/{tenant_id}/restore:
    post:
      summary: Start a tenant restore task from a backup key.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRestoreRequest'
      responses:
        '202':
          description: Tenant restore task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/tenants/{tenant_id}/restore-drill:
    post:
      summary: Start a tenant restore drill task.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRestoreDrillRequest'
      responses:
        '202':
          description: Tenant restore drill task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/entities:
    get:
      summary: Page current entities by kind, source, or shard.
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Shard'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: Entity page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/entities/stream:
    get:
      summary: Stream current entity pages as newline-delimited JSON.
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Shard'
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/entities/{id}:
    get:
      summary: Get one entity by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: Entity result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                  entity:
                    $ref: '#/components/schemas/Entity'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/edges:
    get:
      summary: Page current edges by type and from shard.
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: from_shard
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: Edge page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePage'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/edges/stream:
    get:
      summary: Stream current edge pages as newline-delimited JSON.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/export/snapshot:
    get:
      summary: Export the current snapshot page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: Snapshot export page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/export/snapshot/stream:
    get:
      summary: Stream the current snapshot as newline-delimited JSON.
      description: Defaults to a refs stream for sharded snapshot catalogs. Use inline=true for row-by-row entity and edge records.
      parameters:
        - name: inline
          in: query
          schema:
            type: boolean
          description: Return row-by-row entity and edge records instead of object references.
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/indexes:
    get:
      summary: Get the persisted index catalog.
      responses:
        '200':
          description: Index catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexCatalog'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/indexes/rebuild:
    post:
      summary: Rebuild persisted indexes.
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
          description: Start a background Parquet rebuild.
      responses:
        '200':
          description: Synchronous rebuild completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexCatalog'
        '202':
          description: Background rebuild task started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/indexes/health:
    get:
      summary: Check persisted index health.
      description: Defaults to a bounded catalog/manifest freshness check. Pass deep=true for full object/content validation.
      parameters:
        - name: deep
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Run full index object and content validation.
      responses:
        '200':
          description: Index health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexHealth'
  /v1/indexes/tasks/{task_id}:
    get:
      summary: Get a background index rebuild task.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Index task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTask'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/control/reader-freshness:
    get:
      summary: Report tenant reader freshness and commit tail replay status.
      responses:
        '200':
          description: Reader freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderFreshness'
  /v1/control/reader-lag:
    get:
      summary: Compatibility alias for reader freshness.
      responses:
        '200':
          description: Reader freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderFreshness'
  /v1/control/reader-fleet-readiness:
    get:
      summary: Aggregate reader heartbeat readiness for this tenant.
      parameters:
        - name: min_version
          in: query
          schema:
            type: integer
          description: Version every ready reader must be able to serve; defaults to current writer manifest version.
        - name: min_ready
          in: query
          schema:
            type: integer
          description: Minimum ready readers required; default 1.
        - name: max_staleness_ms
          in: query
          schema:
            type: integer
          description: Heartbeat freshness window; default 30000.
      responses:
        '200':
          description: Reader fleet readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderFleetReadiness'
  /v1/control/reader-traffic-gate:
    get:
      summary: Deployment-facing local reader traffic gate.
      parameters:
        - name: min_version
          in: query
          schema:
            type: integer
          description: Version this reader must serve; defaults to current writer manifest version.
        - name: max_staleness_ms
          in: query
          schema:
            type: integer
          description: Staleness window used only when allow_stale=true; default 30000.
        - name: allow_stale
          in: query
          schema:
            type: boolean
            default: false
          description: When true, bounded stale readers may keep traffic until max_staleness_ms is exceeded.
        - name: refresh
          in: query
          schema:
            type: boolean
            default: true
          description: When true, a lagging cached reader attempts to load at least the target version before deciding.
      responses:
        '200':
          description: This reader can receive traffic for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderTrafficGate'
        '503':
          description: This reader should be drained from traffic for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderTrafficGate'
  /v1/control/recover:
    post:
      summary: Recover contiguous orphan commits into the tenant manifest.
      responses:
        '200':
          description: Recovery report.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/control/integrity-audit:
    get:
      summary: Audit manifest, snapshot, index, and entity-record integrity.
      parameters:
        - name: deep
          in: query
          schema:
            type: boolean
            default: true
          description: When false, skip index object and entity-record expansion.
      responses:
        '200':
          description: Integrity audit report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityAuditReport'
  /v1/control/repair:
    post:
      summary: Inspect or apply deterministic tenant repair.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply:
                  type: boolean
      responses:
        '200':
          description: Repair report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairReport'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/source-policy:
    get:
      summary: Get the tenant source priority policy.
      responses:
        '200':
          description: Source policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePolicyResponse'
    put:
      summary: Replace the tenant source priority policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourcePolicy'
      responses:
        '200':
          description: Updated source policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePolicyResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/tenant-config:
    get:
      summary: Get tenant runtime config overrides.
      responses:
        '200':
          description: Tenant config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigResponse'
    put:
      summary: Replace tenant runtime config overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfig'
      responses:
        '200':
          description: Updated tenant config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/tasks:
    get:
      summary: List unified operational tasks.
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      summary: Start a unified operational task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStartRequest'
      responses:
        '202':
          description: Task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/tasks/{task_id}:
    get:
      summary: Get a unified operational task.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tasks/{task_id}/cancel:
    post:
      summary: Cancel a queued or running unified operational task.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task canceled or already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/tasks/{task_id}/retry:
    post:
      summary: Retry a failed or canceled unified operational task.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Retry task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  securitySchemes:
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
    Kind:
      name: kind
      in: query
      schema:
        type: string
    Source:
      name: source
      in: query
      schema:
        type: string
    Shard:
      name: shard
      in: query
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    ReadMinVersion:
      name: min_version
      in: query
      schema:
        type: integer
        minimum: 0
      description: Require the reader-visible snapshot to be at least this version.
    ReadAllowStale:
      name: allow_stale
      in: query
      schema:
        type: boolean
      description: Permit any locally visible version when min_version is omitted.
    ReadMinVersionHeader:
      name: X-GraphDB-Min-Version
      in: header
      schema:
        type: integer
        minimum: 0
      description: Header form of min_version.
    ReadAllowStaleHeader:
      name: X-GraphDB-Allow-Stale
      in: header
      schema:
        type: boolean
      description: Header form of allow_stale.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Operation disabled in this mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Query parsed but cannot be executed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Admission rejected the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReaderNotFresh:
      description: Reader cannot satisfy the requested minimum version before catch-up timeout.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Retry delay in seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WriteBackpressure:
      description: Write backpressure rejected the request.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Retry delay in seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WriteBackpressureError'
  schemas:
    ErrorResponse:
      type: object
      required: [error, code, message, retryable]
      properties:
        error:
          type: string
          description: Backward-compatible error message.
        code:
          type: string
          enum:
            - bad_request
            - invalid_tenant
            - tenant_required
            - tenant_disabled
            - tenant_deleted
            - operation_disabled
            - not_found
            - method_not_allowed
            - request_too_large
            - too_many_requests
            - internal_error
            - invalid_json
            - invalid_query
            - query_limit_exceeded
            - index_stale
            - reader_not_fresh
            - quota_exceeded
            - lease_held
            - manifest_cas_conflict
            - object_write_conflict
            - object_store_unavailable
            - task_conflict
            - repair_required
            - version_conflict
            - idempotency_conflict
            - commit_tail_too_long
            - index_rebuild_running
            - maintenance_task_running
            - write_admission_queue_timeout
            - write_backpressure
            - request_timeout
            - request_canceled
        message:
          type: string
        retryable:
          type: boolean
        detail:
          type: object
          additionalProperties: true
    WriteBackpressureError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [retry_after_ms, reasons]
          properties:
            retry_after_ms:
              type: integer
            reasons:
              type: array
              items:
                $ref: '#/components/schemas/BackpressureReason'
    BackpressureReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - object_store_latency_high
            - manifest_cas_conflicts_high
            - index_rebuild_running
            - gc_running
            - commit_tail_too_long
            - tenant_entity_quota_exceeded
            - tenant_edge_quota_exceeded
            - write_admission_queue_timeout
        current:
          type: number
        threshold:
          type: number
        message:
          type: string
    CommitRequest:
      type: object
      required: [mutations]
      properties:
        expected_version:
          type: integer
        idempotency_key:
          type: string
          description: Optional direct commit idempotency key. Same key must reuse the same request body.
        mutations:
          $ref: '#/components/schemas/Mutations'
    CommitResult:
      type: object
      properties:
        tenant_id:
          type: string
        version:
          type: integer
        readable_version:
          type: integer
        read_after_commit_id:
          type: string
        skipped:
          type: boolean
        idempotent_replay:
          type: boolean
        data_md5:
          type: string
        suppressed:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    Mutations:
      type: object
      properties:
        upsert_ci_types:
          type: array
          items:
            type: object
        upsert_relation_types:
          type: array
          items:
            type: object
        upsert_entities:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        delete_entities:
          type: array
          items:
            type: string
        upsert_edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
        delete_edges:
          type: array
          items:
            type: string
        delete_edge_requests:
          type: array
          items:
            type: object
    Entity:
      type: object
      required: [kind]
      properties:
        id:
          type: string
        kind:
          type: string
        source:
          type: string
        external_id:
          type: string
        source_priority:
          type: integer
        confidence:
          type: number
        fields:
          type: object
          additionalProperties: true
        field_sources:
          type: object
          additionalProperties: true
    Edge:
      type: object
      required: [type, from, to]
      properties:
        id:
          type: string
        type:
          type: string
        from:
          type: string
        to:
          type: string
        source:
          type: string
        external_id:
          type: string
        source_priority:
          type: integer
        confidence:
          type: number
        fields:
          type: object
          additionalProperties: true
    Conflict:
      type: object
      properties:
        resource_type:
          type: string
        entity_id:
          type: string
        edge_id:
          type: string
        canonical_id:
          type: string
        field:
          type: string
        message:
          type: string
    IngestRequest:
      type: object
      required: [source, collector_id, items]
      properties:
        source:
          type: string
        collector_id:
          type: string
        batch_id:
          type: string
        idempotency_key:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    IngestResult:
      type: object
      properties:
        batch_id:
          type: string
        accepted:
          type: integer
        failed:
          type: integer
        suppressed:
          type: integer
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    QueryRequest:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [match, neighbors, traverse, shortest_path, impact, explain, profile]
        kind:
          type: string
        id:
          type: string
        relation_type:
          type: string
        direction:
          type: string
          enum: [out, in, both]
        where:
          type: array
          items:
            type: object
            additionalProperties: true
        where_expr:
          $ref: '#/components/schemas/FilterExpr'
        edge_where:
          type: array
          items:
            type: object
            additionalProperties: true
        edge_where_expr:
          $ref: '#/components/schemas/FilterExpr'
        project:
          type: array
          items:
            type: string
        sort:
          type: array
          items:
            type: object
            additionalProperties: true
        aggregate:
          type: array
          items:
            type: object
            additionalProperties: true
        group_by:
          type: array
          items:
            type: string
        having:
          type: array
          items:
            type: object
            additionalProperties: true
        having_expr:
          $ref: '#/components/schemas/FilterExpr'
        path:
          type: object
          additionalProperties: true
        limit:
          type: integer
        cursor:
          type: string
        timeout_ms:
          type: integer
        min_version:
          type: integer
          minimum: 0
          description: Require read-after-write visibility at or above this manifest version.
        allow_stale:
          type: boolean
          description: Permit a cached visible version when min_version is omitted.
    GQLQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Text GQL query such as FIND host WHERE hostname PREFIX "app-" LIMIT 100.
        min_version:
          type: integer
          minimum: 0
          description: Require read-after-write visibility at or above this manifest version.
        allow_stale:
          type: boolean
          description: Permit a cached visible version when min_version is omitted.
        cursor:
          type: string
          description: Opaque cursor from a previous GQL query response.
        timeout_ms:
          type: integer
          minimum: 0
        cost_limit:
          type: integer
          minimum: 0
        profile:
          type: boolean
          description: Attach plan and operator profile to the compiled query response.
    FilterExpr:
      type: object
      description: Boolean filter tree. Composite op is and/or/not; leaf op uses eq, neq, in, gt, gte, lt, lte, prefix, contains, fuzzy, or exists.
      properties:
        op:
          type: string
        field:
          type: string
        value: {}
        children:
          type: array
          items:
            $ref: '#/components/schemas/FilterExpr'
    QueryResponse:
      type: object
      properties:
        version:
          type: integer
        results:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: string
        aggregates:
          type: object
          additionalProperties: true
        groups:
          type: array
          items:
            type: object
            additionalProperties: true
        plan:
          type: object
          additionalProperties: true
        profile:
          type: object
          additionalProperties: true
    RunningQuery:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        op:
