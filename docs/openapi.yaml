        backup_key:
          type: string
          description: Optional backup result key or backup manifest key. If omitted, the drill creates a fresh backup first.
        target_tenant_id:
          type: string
        target_prefix:
          type: string
          description: Optional alternate object-store prefix for the restored drill tenant.
        cleanup:
          type: boolean
          description: Defaults to true and purges the restored drill tenant after proof generation.
        dry_run:
          type: boolean
        query_templates:
          type: array
          items:
            type: string
          description: Optional saved query template names. If omitted, all saved query templates are run.
        query_timeout_ms:
          type: integer
          format: int64
    TenantInfo:
      allOf:
        - $ref: '#/components/schemas/TenantRequest'
        - type: object
          properties:
            status:
              type: string
              enum: [active, disabled, deleted]
            cloned_from:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            disabled_at:
              type: string
              format: date-time
            deleted_at:
              type: string
              format: date-time
            manifest_version:
              type: integer
            snapshot_version:
              type: integer
            commit_tail_length:
              type: integer
            exists:
              type: boolean
            last_updated_at:
              type: string
              format: date-time
    TenantPurgeReport:
      type: object
      properties:
        tenant_id:
          type: string
        deleted:
          type: integer
        deleted_keys:
          type: array
          items:
            type: string
    TenantConfigResponse:
      type: object
