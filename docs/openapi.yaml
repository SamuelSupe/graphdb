openapi: 3.0.3
info:
  title: GGraphDB API
  version: 1.2.0
  description: Object-store backed multi-tenant current-state property knowledge graph API. Version 1.2 preserves the 1.0 core data layout.
servers:
  - url: http://localhost:8080
security:
  - GatewayBearer: []
    TenantHeader: []
paths:
  /openapi.yaml:
    get:
      security: []
      summary: Fetch this OpenAPI contract.
      responses:
        '200':
          description: OpenAPI YAML document.
          content:
            application/yaml:
              schema:
                type: string
  /v1/health:
    get:
      security: []
      summary: Report process liveness and coordinator status.
      responses:
        '200':
          description: The process is alive; status reflects the last background coordinator sample and is degraded when that sample is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessHealth'
  /v1/readiness:
    get:
      security: []
      summary: Report whether this process is ready to receive traffic.
      responses:
        '200':
          description: The process, object store, and configured coordinator are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessReadiness'
        '503':
          description: The object store or configured coordinator is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessReadiness'
  /metrics:
    get:
      security: []
      summary: Export Prometheus metrics from the admin listener.
      description: This endpoint has no tenant scope and must be protected by the management network or gateway.
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
  /v1/commits:
    post:
      summary: Apply an atomic direct mutation commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: Commit applied, skipped by md5, or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/WriteBackpressure'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/ingest/batches:
    post:
      summary: Apply a collector ingestion batch with idempotency and partial failure reporting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Batch accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '207':
          description: Batch accepted with item failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '202':
          description: Batch durably appended to the local ingest WAL. Returned only when GRAPHDB_INGEST_MODE=wal.
          headers:
            Location:
              schema:
                type: string
              description: Batch status resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/WriteBackpressure'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/ingest/batches/{source}/{collector_id}/{batch_id}:
    get:
      summary: Get an active WAL batch status or its finalized ingest record.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
        - name: collector_id
          in: path
          required: true
          schema:
            type: string
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active or finalized batch status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestBatchStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/imports:
    post:
      summary: Upload CSV or JSONL and start a resumable bulk import task.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [jsonl, csv]
          description: Optional when Content-Type identifies JSONL or CSV.
        - name: source
          in: query
          schema:
            type: string
            default: bulk_import
        - name: collector_id
          in: query
          schema:
            type: string
            default: file
        - name: batch_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
        - name: on_error
          in: query
          schema:
            type: string
            enum: [abort, continue]
            default: abort
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              description: One IngestItem JSON object per non-empty line.
          text/csv:
            schema:
              type: string
              description: CSV with a required record_type column.
      responses:
        '202':
          description: Bulk import task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: Import source exceeds the 32 MiB request limit.
        '429':
          $ref: '#/components/responses/WriteBackpressure'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/ingest/collectors/{source}/{collector_id}:
    get:
      summary: Get the materialized status for one collector.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
        - name: collector_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Collector status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectorStatus'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/ingest/deadletters/{source}:
    get:
      summary: List dead-letter ingestion batches for a source.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dead-letter records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deadletters:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeadLetter'
  /v1/ingest/deadletters/{source}/replay:
    post:
      summary: Replay unresolved dead-letter batches for a source.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Replay report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/ci-types:
    get:
      summary: List legacy CI type metadata.
      responses:
        '200':
          description: Legacy alias of the entity type list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CITypeList'
  /v1/entity-types:
    get:
      summary: List domain-neutral entity type metadata.
      responses:
        '200':
          description: Entity types at the visible graph version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityTypeList'
  /v1/relation-types:
    get:
      summary: List relation type metadata.
      responses:
        '200':
          description: Relation types at the visible graph version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                  relation_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/RelationType'
  /v1/relation-schemas:
    get:
      summary: List relation property schemas.
      responses:
        '200':
          description: Relation property schema sidecar catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationSchemaCatalog'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/relation-schemas/{relation_type}:
    parameters:
      - name: relation_type
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Create or replace one relation property schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationSchema'
      responses:
        '200':
          description: Updated relation schema catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationSchemaCatalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
    delete:
      summary: Delete one relation property schema.
      responses:
        '200':
          description: Updated relation schema catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationSchemaCatalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/query:
    post:
      summary: Execute the JSON query DSL.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/query/stream:
    post:
      summary: Execute a query and stream newline-delimited JSON pages.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/query/graphql:
    post:
      summary: Execute a GraphQL query document.
      description: Accepts one graph root field and returns a GraphQL data/errors envelope. Query execution errors are encoded in a 200 response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
      responses:
        '200':
          description: GraphQL execution response, including query execution errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQLResponse'
        '400':
          description: Invalid GraphQL document, operation, or variables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQLResponse'
  /v1/query/gql:
    post:
      deprecated: true
      summary: Execute the deprecated 1.0 FIND/MATCH text DSL.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GQLQueryRequest'
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/query/gql/stream:
    post:
      deprecated: true
      summary: Execute the deprecated 1.0 text DSL as newline-delimited JSON.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GQLQueryRequest'
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/query/templates:
    get:
      summary: List saved query templates for the tenant.
      responses:
        '200':
          description: Saved query list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedQuery'
    post:
      summary: Create or replace a saved query template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedQuery'
      responses:
        '200':
          description: Saved query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/query/templates/{name}/run:
    post:
      summary: Execute one saved query template.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/queries/running:
    get:
      summary: List running queries for the tenant on this process.
      responses:
        '200':
          description: Running queries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunningQuery'
  /v1/queries/running/{query_id}:
    delete:
      summary: Cancel a running query on this process.
      parameters:
        - name: query_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query cancellation requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  killed:
                    type: boolean
                  query:
                    $ref: '#/components/schemas/RunningQuery'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tenants:
    get:
      summary: List tenants.
      parameters:
        - name: include_legacy
          in: query
          required: false
          schema:
            type: boolean
          description: Scan legacy tenant prefixes when true; default lists only lifecycle-managed tenants.
      responses:
        '200':
          description: Tenant list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantInfo'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
    post:
      summary: Create or materialize tenant metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRequest'
      responses:
        '200':
          description: Tenant created or already present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenant-usage:
    get:
      summary: Report tenant object count, bytes, and retention policy.
      responses:
        '200':
          description: Tenant usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUsage'
  /v1/tenants/{tenant_id}:
    get:
      summary: Get tenant status and metadata.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
    put:
      summary: Replace tenant display metadata.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRequest'
      responses:
        '200':
          description: Tenant metadata updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
    delete:
      summary: Soft delete a tenant.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant marked deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenants/{tenant_id}/disable:
    post:
      summary: Disable tenant writes.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenants/{tenant_id}/enable:
    post:
      summary: Re-enable a disabled or soft-deleted tenant.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '200':
          description: Tenant enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenants/{tenant_id}/purge:
    post:
      summary: Permanently delete all objects under a tenant prefix.
      parameters:
        - $ref: '#/components/parameters/TenantID'
        - name: force
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Tenant purge report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPurgeReport'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenants/{tenant_id}/clone:
    post:
      summary: Clone a tenant current snapshot into a new tenant.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCloneRequest'
      responses:
        '202':
          description: Tenant cloned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenants/{tenant_id}/backup:
    post:
      summary: Start a tenant backup task.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      responses:
        '202':
          description: Tenant backup task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenants/{tenant_id}/restore:
    post:
      summary: Start a tenant restore task from a backup key.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRestoreRequest'
      responses:
        '202':
          description: Tenant restore task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenants/{tenant_id}/restore-drill:
    post:
      summary: Start a tenant restore drill task.
      parameters:
        - $ref: '#/components/parameters/TenantID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantRestoreDrillRequest'
      responses:
        '202':
          description: Tenant restore drill task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/entities:
    get:
      summary: Page current entities by kind, source, or shard.
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Shard'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: Entity page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/entities/stream:
    get:
      summary: Stream current entity pages as newline-delimited JSON.
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Source'
        - $ref: '#/components/parameters/Shard'
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/entities/{id}:
    get:
      summary: Get one entity by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: Entity result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                  entity:
                    $ref: '#/components/schemas/Entity'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
  /v1/edges:
    get:
      summary: Page current edges by type and from shard.
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: from_shard
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: Edge page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdgePage'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/edges/stream:
    get:
      summary: Stream current edge pages as newline-delimited JSON.
      parameters:
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/export/snapshot:
    get:
      summary: Export the current snapshot page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: Snapshot export page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/export/snapshot/stream:
    get:
      summary: Stream the current snapshot as newline-delimited JSON.
      description: Defaults to a refs stream for sharded snapshot catalogs. Use inline=true for row-by-row entity and edge records.
      parameters:
        - name: inline
          in: query
          schema:
            type: boolean
          description: Return row-by-row entity and edge records instead of object references.
        - $ref: '#/components/parameters/ReadMinVersion'
        - $ref: '#/components/parameters/ReadAllowStale'
        - $ref: '#/components/parameters/ReadMinVersionHeader'
        - $ref: '#/components/parameters/ReadAllowStaleHeader'
      responses:
        '200':
          description: NDJSON stream.
          content:
            application/x-ndjson:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ReaderNotFresh'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/indexes:
    get:
      summary: Get the persisted index catalog.
      responses:
        '200':
          description: Index catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexCatalog'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a persisted secondary index definition and queue rebuild.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexDefinition'
      responses:
        '202':
          description: Index definition created and rebuild queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexDefinitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/indexes/definitions:
    get:
      summary: List persisted secondary index definitions.
      responses:
        '200':
          description: Index definitions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  indexes:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexDefinition'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/indexes/definitions/{name}:
    delete:
      summary: Delete a secondary index definition and queue rebuild.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Index definition removed and rebuild queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexDefinitionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/indexes/rebuild:
    post:
      summary: Rebuild persisted indexes.
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
          description: Start a background Parquet rebuild.
      responses:
        '200':
          description: Synchronous rebuild completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexCatalog'
        '202':
          description: Background rebuild task started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/indexes/health:
    get:
      summary: Check persisted index health.
      description: Defaults to a bounded catalog/manifest freshness check. Pass deep=true for full object/content validation.
      parameters:
        - name: deep
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Run full index object and content validation.
      responses:
        '200':
          description: Index health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexHealth'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/indexes/tasks/{task_id}:
    get:
      summary: Get a background index rebuild task.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Index task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexTask'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/control/reader-freshness:
    get:
      summary: Report tenant reader freshness and commit tail replay status.
      responses:
        '200':
          description: Reader freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderFreshness'
  /v1/control/writer-lease:
    get:
      summary: Get the current local writer lease and fencing token.
      responses:
        '200':
          description: Writer lease.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriterLease'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/control/reader-lag:
    get:
      summary: Compatibility alias for reader freshness.
      responses:
        '200':
          description: Reader freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderFreshness'
  /v1/control/reader-fleet-readiness:
    get:
      summary: Aggregate reader heartbeat readiness for this tenant.
      parameters:
        - name: min_version
          in: query
          schema:
            type: integer
          description: Version every ready reader must be able to serve; defaults to current writer manifest version.
        - name: min_ready
          in: query
          schema:
            type: integer
          description: Minimum ready readers required; default 1.
        - name: max_staleness_ms
          in: query
          schema:
            type: integer
          description: Heartbeat freshness window; default 30000.
      responses:
        '200':
          description: Reader fleet readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderFleetReadiness'
  /v1/control/reader-traffic-gate:
    get:
      summary: Deployment-facing local reader traffic gate.
      parameters:
        - name: min_version
          in: query
          schema:
            type: integer
          description: Version this reader must serve; defaults to current writer manifest version.
        - name: max_staleness_ms
          in: query
          schema:
            type: integer
          description: Staleness window used only when allow_stale=true; default 30000.
        - name: allow_stale
          in: query
          schema:
            type: boolean
            default: false
          description: When true, bounded stale readers may keep traffic until max_staleness_ms is exceeded.
        - name: refresh
          in: query
          schema:
            type: boolean
            default: true
          description: When true, a lagging cached reader attempts to load at least the target version before deciding.
      responses:
        '200':
          description: This reader can receive traffic for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderTrafficGate'
        '503':
          description: This reader should be drained from traffic for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderTrafficGate'
  /v1/control/recover:
    post:
      summary: Recover contiguous orphan commits into the tenant manifest.
      responses:
        '200':
          description: Recovery report.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/control/integrity-audit:
    get:
      summary: Audit manifest, snapshot, index, and entity-record integrity.
      parameters:
        - name: deep
          in: query
          schema:
            type: boolean
            default: true
          description: When false, skip index object and entity-record expansion.
      responses:
        '200':
          description: Integrity audit report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrityAuditReport'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/control/repair:
    post:
      summary: Inspect or apply deterministic tenant repair.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply:
                  type: boolean
      responses:
        '200':
          description: Repair report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairReport'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/control/cleanup-commits:
    post:
      summary: Delete unreferenced stale commit objects while retaining future commits.
      responses:
        '200':
          description: Commit cleanup report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/control/gc:
    post:
      summary: Run bounded tenant garbage collection.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GCRequest'
      responses:
        '200':
          description: Garbage collection report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GCReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/compact:
    post:
      summary: Compact the current graph into a new immutable snapshot manifest.
      responses:
        '200':
          description: New tenant manifest.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/source-policy:
    get:
      summary: Get the tenant source priority policy.
      responses:
        '200':
          description: Source policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePolicyResponse'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
    put:
      summary: Replace the tenant source priority policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourcePolicy'
      responses:
        '200':
          description: Updated source policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePolicyResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tenant-config:
    get:
      summary: Get tenant runtime config overrides.
      responses:
        '200':
          description: Tenant config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigResponse'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
    put:
      summary: Replace tenant runtime config overrides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantConfig'
      responses:
        '200':
          description: Updated tenant config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantConfigResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tasks:
    get:
      summary: List unified operational tasks.
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Task list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
    post:
      summary: Start a unified operational task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStartRequest'
      responses:
        '202':
          description: Task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tasks/{task_id}:
    get:
      summary: Get a unified operational task.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tasks/{task_id}/cancel:
    post:
      summary: Cancel a queued or running unified operational task.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task canceled or already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
  /v1/tasks/{task_id}/retry:
    post:
      summary: Retry a failed or canceled unified operational task.
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Retry task queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/CoordinatorUnavailable'
components:
  securitySchemes:
    GatewayBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity credential validated by the trusted gateway; GGraphDB does not validate this token directly.
    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant routing metadata injected by a trusted gateway; this header is not proof of identity.
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
    Kind:
      name: kind
      in: query
      schema:
        type: string
    Source:
      name: source
      in: query
      schema:
        type: string
    Shard:
      name: shard
      in: query
      schema:
        type: integer
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    ReadMinVersion:
      name: min_version
      in: query
      schema:
        type: integer
        minimum: 0
      description: Require the reader-visible snapshot to be at least this version.
    ReadAllowStale:
      name: allow_stale
      in: query
      schema:
        type: boolean
      description: Permit any locally visible version when min_version is omitted.
    ReadMinVersionHeader:
      name: X-GraphDB-Min-Version
      in: header
      schema:
        type: integer
        minimum: 0
      description: Header form of min_version.
    ReadAllowStaleHeader:
      name: X-GraphDB-Allow-Stale
      in: header
      schema:
        type: boolean
      description: Header form of allow_stale.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Operation disabled in this mode.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Query parsed but cannot be executed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Admission rejected the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReaderNotFresh:
      description: Reader cannot satisfy the requested minimum version before catch-up timeout.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Retry delay in seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WriteBackpressure:
      description: Write backpressure rejected the request.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Retry delay in seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WriteBackpressureError'
    Conflict:
      description: The expected version changed, another writer still owns the idempotency key, or the CAS retry budget was exhausted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CoordinatorUnavailable:
      description: A required coordinator or object-store dependency is unavailable; writes fail closed and never fall back to local coordination.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Retry delay in seconds when supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CoordinatorStatus:
      type: object
      required: [backend, available, schema_version, tenants, outbox_backlog, derived_backlog, max_legacy_mirror_lag, checked_at]
      properties:
        backend:
          type: string
          enum: [local, postgres]
        available:
          type: boolean
        schema_version:
          type: integer
        namespace:
          type: string
        tenants:
          type: integer
        outbox_backlog:
          type: integer
        derived_backlog:
          type: integer
        max_legacy_mirror_lag:
          type: integer
        checked_at:
          type: string
          format: date-time
        last_error:
          type: string
    ObjectStoreStatus:
      type: object
      required: [available, checked_at]
      properties:
        available:
          type: boolean
        checked_at:
          type: string
          format: date-time
        last_error:
          type: string
    ProcessHealth:
      type: object
      required: [status, mode, coordination, build]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        mode:
          type: string
          enum: [all, writer, reader]
        coordination:
          $ref: '#/components/schemas/CoordinatorStatus'
        build:
          $ref: '#/components/schemas/BuildInfo'
    ProcessReadiness:
      type: object
      required: [status, mode, coordination, object_store, build]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        mode:
          type: string
          enum: [all, writer, reader]
        coordination:
          $ref: '#/components/schemas/CoordinatorStatus'
        object_store:
          $ref: '#/components/schemas/ObjectStoreStatus'
        build:
          $ref: '#/components/schemas/BuildInfo'
    BuildInfo:
      type: object
      required: [version, commit, date, go_version]
      properties:
        version:
          type: string
        commit:
          type: string
        date:
          type: string
        go_version:
          type: string
    ErrorResponse:
      type: object
      required: [error, code, message, retryable]
      properties:
        error:
          type: string
          description: Backward-compatible error message.
        code:
          type: string
          enum:
            - bad_request
            - invalid_tenant
            - tenant_required
            - tenant_disabled
            - tenant_deleted
