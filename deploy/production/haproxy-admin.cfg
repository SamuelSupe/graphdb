frontend graphdb_admin
    bind :8081
    default_backend admin_leader

backend admin_leader
    option httpchk
    http-check send meth GET uri /v1/readiness ver HTTP/1.1 hdr Host graphdb
    http-check expect status 200
    default-server inter 1s fall 1 rise 1 resolvers docker init-addr libc,none
    server node1 node1:8082 check
    server node2 node2:8082 check
    server node3 node3:8082 check
