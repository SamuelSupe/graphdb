name: Build GGraphDB release

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  verify:
    name: Unit, vet, race, and 2.0 contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true

      - name: Run static release gate
        run: RELEASE_GATE_VERIFY_ONLY=1 scripts/release_gate.sh

      - name: Test Python SDK
        run: python3 -m unittest discover -s sdk/python/tests -p 'test_*.py'

  integration:
    name: Local disk, WAL recovery, load, and restore
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true

      - name: Run integration release gate
        run: RELEASE_GATE_SKIP_STATIC=1 scripts/release_gate.sh

  object-backup:
    uses: ./.github/workflows/object-backup.yml

  raft:
    uses: ./.github/workflows/raft.yml
    with:
      soak: true

  local-soak:
    name: Local disk 30-minute mixed read/write soak
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Run local recovery and soak gate
        env:
          RELEASE_GATE_SKIP_STATIC: 1
          GRAPHDB_GATE_SOAK: 1
          GRAPHDB_GATE_OUTPUT: ${{ github.workspace }}/artifacts/local-gate
        run: scripts/release_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-disk-soak
          path: |
            artifacts/local-gate/*.json
            artifacts/local-gate/*.ndjson
            artifacts/local-gate/*.txt
            artifacts/local-gate/*.log

  release:
    name: Build and publish release assets
    needs: [verify, integration, object-backup, local-soak, raft]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true

      - name: Download local disk evidence
        uses: actions/download-artifact@v4
        with:
          name: local-disk-soak
          path: artifacts/local-gate

      - name: Download object backup evidence
        uses: actions/download-artifact@v4
        with:
          name: object-backup-gate
          path: artifacts/object-backup-gate

      - name: Download Raft evidence
        uses: actions/download-artifact@v4
        with:
          name: raft-gate
          path: artifacts/raft-gate

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          test "$tag" = "v$(cat VERSION)"
          grep -Fx "# GGraphDB ${tag}" release/local-disk.md
          commit="${GITHUB_SHA}"
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          root="dist/${tag}"
          buildinfo_package="github.com/SamuelSupe/graphdb/v2/internal/buildinfo"
          ldflags="-s -w -X ${buildinfo_package}.Version=${tag} -X ${buildinfo_package}.Commit=${commit} -X ${buildinfo_package}.Date=${build_date}"
          mkdir -p "$root/bin" "$root/docs" "$root/examples" "$root/scripts" \
            "$root/deploy/nginx" "$root/deploy/raft" "$root/deploy/sharded" "$root/release/evidence"

          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -mod=readonly -trimpath -buildvcs=false -ldflags="$ldflags" \
              -o "$root/bin/graphdb-${os}-${arch}" ./cmd/graphdb
          done

          cp VERSION README.md README.zh-CN.md CHANGELOG.md CONTRIBUTING.md LICENSE SECURITY.md \
            Dockerfile .dockerignore docker-compose.yml docker-compose.backup.yml \
            docker-compose.raft.yml docker-compose.sharded.yml \
            go.mod go.sum "$root/"
          cp -R cmd internal tools "$root/"
          cp -R docs/. "$root/docs/"
          cp -R examples/. "$root/examples/"
          cp -R sdk "$root/"
          cp deploy/object-backup.env.example "$root/deploy/"
          cp deploy/nginx/graphdb.conf.example "$root/deploy/nginx/"
          cp deploy/raft/haproxy.cfg "$root/deploy/raft/"
          cp deploy/sharded/haproxy.cfg "$root/deploy/sharded/"
          cp -R artifacts/local-gate artifacts/object-backup-gate artifacts/raft-gate "$root/release/evidence/"
          cp release/capacity-envelope.yaml release/local-disk.md "$root/release/"
          cp scripts/capacity_baseline.sh \
            scripts/check_release_freeze.sh scripts/check_workspace_hygiene.sh \
            scripts/release_gate.sh scripts/local_disk_compare.sh scripts/local_disk_benchmark.py \
            scripts/local_disk_report.py scripts/local_disk_optimization.py \
            scripts/object_backup_gate.sh scripts/object_backup_http.py "$root/scripts/"
          cp scripts/raft_gate.sh scripts/raft_gate_dual.py scripts/raft_gate_sharded.py "$root/scripts/"
          cp scripts/raft_rolling_upgrade.py scripts/raft_rolling_gate.py "$root/scripts/"
          cp -R scripts/raft-gate "$root/scripts/"
          printf '{"version":"%s","commit":"%s","build_date":"%s","go_version":"%s"}\n' \
            "$tag" "$commit" "$build_date" "$(go version | cut -d' ' -f3)" > "$root/BUILD-METADATA.json"
          (cd "$root" && sha256sum bin/* > SHA256SUMS)

          tar -C dist -czf "dist/graphdb-${tag}.tar.gz" "$tag"
          (cd dist && sha256sum "graphdb-${tag}.tar.gz" > "graphdb-${tag}.tar.gz.sha256")

      - name: Verify extracted release package
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "graphdb-${GITHUB_REF_NAME}.tar.gz.sha256")
          unpacked="$(mktemp -d)"
          tar -xzf "dist/graphdb-${GITHUB_REF_NAME}.tar.gz" -C "$unpacked"
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          cd "$unpacked/$GITHUB_REF_NAME"
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('release/evidence/raft-gate/metadata.json').read_text())
          digest = hashlib.file_digest(Path('bin/graphdb-linux-amd64').open('rb'), 'sha256').hexdigest()
          assert report['result'] == 'PASS', report
          assert digest == report['binary_sha256'], 'packaged binary differs from the Raft-qualified binary'
          PY
          bin/graphdb-linux-amd64 version
          export GRAPHDB_RAFT_TOKEN=release-configuration-check-only-0123456789
          docker compose -f docker-compose.raft.yml config --quiet
          docker compose -f docker-compose.sharded.yml config --quiet
          docker build --build-arg VERSION="$GITHUB_REF_NAME" \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$build_date" \
            --tag graphdb:release-check .
          trap 'docker logs graphdb-release-check; docker rm -f graphdb-release-check >/dev/null' EXIT
          docker run -d --name graphdb-release-check -p 127.0.0.1:38080:8080 graphdb:release-check
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 \
            http://127.0.0.1:38080/v1/readiness

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GGraphDB $GITHUB_REF_NAME" \
            --target main --verify-tag --latest=true \
            --notes-file release/local-disk.md \
            "dist/graphdb-${GITHUB_REF_NAME}.tar.gz" \
            "dist/graphdb-${GITHUB_REF_NAME}.tar.gz.sha256"
