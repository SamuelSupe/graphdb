name: Build GGraphDB local disk release

on:
  push:
    tags:
      - "v*-local.*"

permissions:
  contents: write

jobs:
  verify:
    name: Unit, vet, race, and v1.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static release gate
        run: RELEASE_GATE_VERIFY_ONLY=1 scripts/release_gate.sh

      - name: Test Python SDK
        run: python3 -m unittest discover -s sdk/python/tests -p 'test_*.py'

  integration:
    name: Local disk, WAL recovery, load, and restore
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration release gate
        run: RELEASE_GATE_SKIP_STATIC=1 scripts/release_gate.sh

  object-backup:
    uses: ./.github/workflows/object-backup.yml

  local-soak:
    name: Local disk 30-minute mixed read/write soak
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run local recovery and soak gate
        env:
          RELEASE_GATE_SKIP_STATIC: 1
          GRAPHDB_GATE_SOAK: 1
          GRAPHDB_GATE_OUTPUT: ${{ github.workspace }}/artifacts/local-gate
        run: scripts/release_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-disk-soak
          path: |
            artifacts/local-gate/*.json
            artifacts/local-gate/*.ndjson
            artifacts/local-gate/*.txt
            artifacts/local-gate/*.log

  release:
    name: Build and publish release assets
    needs: [verify, integration, object-backup, local-soak]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download local disk evidence
        uses: actions/download-artifact@v4
        with:
          name: local-disk-soak
          path: artifacts/local-gate

      - name: Download object backup evidence
        uses: actions/download-artifact@v4
        with:
          name: object-backup-gate
          path: artifacts/object-backup-gate

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          root="dist/${tag}"
          buildinfo_package="gitlab.jiagouyun.com/guance/graphdb/internal/buildinfo"
          ldflags="-s -w -X ${buildinfo_package}.Version=${tag} -X ${buildinfo_package}.Commit=${commit} -X ${buildinfo_package}.Date=${build_date}"
          mkdir -p "$root/bin" "$root/docs" "$root/examples" "$root/scripts" \
            "$root/deploy/nginx" "$root/release/evidence"

          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -mod=readonly -trimpath -ldflags="$ldflags" \
              -o "$root/bin/graphdb-${os}-${arch}" ./cmd/graphdb
          done

          cp README.md README.zh-CN.md CHANGELOG.md CONTRIBUTING.md LICENSE SECURITY.md \
            Dockerfile docker-compose.yml docker-compose.backup.yml \
            go.mod go.sum "$root/"
          cp -R docs/. "$root/docs/"
          cp -R examples/. "$root/examples/"
          cp -R sdk "$root/"
          cp deploy/object-backup.env.example "$root/deploy/"
          cp deploy/nginx/graphdb.conf.example "$root/deploy/nginx/"
          cp -R artifacts/local-gate artifacts/object-backup-gate "$root/release/evidence/"
          cp release/capacity-envelope.yaml release/freeze-1.1.yaml release/local-disk.md "$root/release/"
          cp scripts/capacity_baseline.sh scripts/compatibility_v1_0_v1_1.sh \
            scripts/check_release_freeze.sh scripts/check_workspace_hygiene.sh \
            scripts/release_gate.sh scripts/local_disk_compare.sh scripts/local_disk_benchmark.py \
            scripts/local_disk_report.py scripts/local_disk_optimization.py \
            scripts/object_backup_gate.sh scripts/object_backup_http.py "$root/scripts/"
          printf '%s\n' "$tag" > "$root/VERSION"
          printf '{"version":"%s","commit":"%s","build_date":"%s","go_version":"%s"}\n' \
            "$tag" "$commit" "$build_date" "$(go version | cut -d' ' -f3)" > "$root/BUILD-METADATA.json"
          (cd "$root" && sha256sum bin/* > SHA256SUMS)

          tar -C dist -czf "dist/graphdb-${tag}.tar.gz" "$tag"
          (cd dist && sha256sum "graphdb-${tag}.tar.gz" > "graphdb-${tag}.tar.gz.sha256")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GGraphDB $GITHUB_REF_NAME — Local disk edition" \
            --verify-tag --prerelease --latest=false \
            --notes-file release/local-disk.md \
            "dist/graphdb-${GITHUB_REF_NAME}.tar.gz" \
            "dist/graphdb-${GITHUB_REF_NAME}.tar.gz.sha256"
