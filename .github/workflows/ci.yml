name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/local-disk-v2
      - codex/raft-ha

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, vet, race, 2.0 contracts, and SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: go.sum

      - name: Run static release gate
        run: RELEASE_GATE_VERIFY_ONLY=1 scripts/release_gate.sh

      - name: Set up Node for console boundary checks
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test management console boundaries
        run: node --test internal/adminui/console_test.mjs

      - name: Test Python SDK
        run: python3 -m unittest discover -s sdk/python/tests -p 'test_*.py'

      - name: Test backup automation and rolling catch-up
        run: |
          python3 -m unittest discover -s scripts -p 'backup_automation_test.py'
          python3 -m unittest discover -s scripts -p 'raft_rolling_gate_test.py'

  local-soak:
    name: Local disk 30-minute mixed read/write soak
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
      - name: Run local recovery and soak gate
        env:
          RELEASE_GATE_SKIP_STATIC: 1
          GRAPHDB_GATE_SOAK: 1
          GRAPHDB_GATE_SOAK_DIAGNOSTICS: 1
          GRAPHDB_INDEX_RANGE_PAGES: 'true'
          GRAPHDB_GATE_OUTPUT: ${{ github.workspace }}/artifacts/local-gate
        run: scripts/release_gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-disk-soak
          path: |
            artifacts/local-gate/*.json
            artifacts/local-gate/*.ndjson
            artifacts/local-gate/*.txt
            artifacts/local-gate/*.log
            artifacts/local-gate/*.pprof

  integration:
    name: Local disk, WAL recovery, load, and restore
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: true
          cache-dependency-path: go.sum

      - name: Run integration release gate
        run: RELEASE_GATE_SKIP_STATIC=1 scripts/release_gate.sh

  object-backup:
    uses: ./.github/workflows/object-backup.yml

  gateway:
    uses: ./.github/workflows/gateway.yml

  raft:
    uses: ./.github/workflows/raft.yml

  container:
    name: Build and start container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        shell: bash
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag graphdb:ci \
            .

      - name: Start image
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs graphdb-ci; docker rm -f graphdb-ci >/dev/null; docker volume rm graphdb-ci-data >/dev/null' EXIT
          docker run -d --name graphdb-ci -p 127.0.0.1:38080:8080 \
            -v graphdb-ci-data:/var/lib/graphdb graphdb:ci
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 \
            http://127.0.0.1:38080/v1/readiness
          curl --fail http://127.0.0.1:38080/v1/commits \
            -H 'X-Tenant-ID: image-ci' -H 'Content-Type: application/json' \
            -d '{"mutations":{"upsert_entities":[{"id":"host:ci","kind":"host","fields":{"name":"persistent"}}]}}'
          curl --fail http://127.0.0.1:38080/v1/export/snapshot -H 'X-Tenant-ID: image-ci' > before.json
          docker restart --timeout 60 graphdb-ci
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 \
            http://127.0.0.1:38080/v1/export/snapshot -H 'X-Tenant-ID: image-ci' > after.json
          python3 -c 'import json; assert json.load(open("before.json")) == json.load(open("after.json"))'
