name: Raft and tenant sharding gate

on:
  workflow_call:
    inputs:
      soak:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  raft:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build candidate image
        run: |
          version="$(cat VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="$GITHUB_REF_NAME"; fi
          docker build --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(git show -s --format=%cI "$GITHUB_SHA")" -t graphdb:raft-gate .
      - name: Run real-process compatibility and failure gate
        env:
          GRAPHDB_GATE_IMAGE: graphdb:raft-gate
          GRAPHDB_GATE_OUTPUT: ${{ github.workspace }}/artifacts/raft-gate
        run: scripts/raft_gate.sh
      - name: Qualify rolling upgrade from the integrity development build
        if: inputs.soak
        env:
          GRAPHDB_ROLLING_BASE_IMAGE: graphdb:raft-rolling-source
          GRAPHDB_ROLLING_TARGET_IMAGE: graphdb:raft-gate
          GRAPHDB_ROLLING_OUTPUT: ${{ github.workspace }}/artifacts/raft-gate/rolling
          GRAPHDB_ROLLING_BASE_COMMIT: 5fd0c9704ca573b902c66eaa1cbbffd2dc8c9b4a
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/raft-rolling-source"
          mkdir -p "$baseline"
          git archive "$GRAPHDB_ROLLING_BASE_COMMIT" | tar -x -C "$baseline"
          docker build --build-arg VERSION=2.2.2-raft-integrity1 \
            --build-arg COMMIT="$GRAPHDB_ROLLING_BASE_COMMIT" \
            --build-arg BUILD_DATE="$(git show -s --format=%cI "$GRAPHDB_ROLLING_BASE_COMMIT")" \
            -t "$GRAPHDB_ROLLING_BASE_IMAGE" "$baseline"
          export GRAPHDB_ROLLING_BASE_SHA256="$(docker run --rm --entrypoint sha256sum \
            "$GRAPHDB_ROLLING_BASE_IMAGE" /usr/local/bin/graphdb | cut -d' ' -f1)"
          export GRAPHDB_ROLLING_TARGET_VERSION="$GITHUB_REF_NAME"
          export GRAPHDB_ROLLING_TARGET_COMMIT="$GITHUB_SHA"
          export GRAPHDB_RAFT_TOKEN="$(openssl rand -hex 32)"
          python3 scripts/raft_rolling_gate.py
      - name: Run streaming snapshots, prepared maintenance and runtime recovery gate
        env:
          GRAPHDB_GATE_IMAGE: graphdb:raft-gate
          GRAPHDB_GATE_OUTPUT: ${{ github.workspace }}/artifacts/raft-gate/enhanced
          GRAPHDB_GATE_ENHANCED: 'true'
          GRAPHDB_GATE_RECOVERY: 'true'
          GRAPHDB_GATE_DISK: 'true'
        run: scripts/raft_gate.sh
      - name: Run protocol 3 GC isolation and rolling restart gate
        env:
          GRAPHDB_GATE_IMAGE: graphdb:raft-gate
          GRAPHDB_GATE_OUTPUT: ${{ github.workspace }}/artifacts/raft-gate/protocol3
          GRAPHDB_GATE_ENHANCED: 'true'
          GRAPHDB_GATE_PROTOCOL_VERSION: '3'
          GRAPHDB_GATE_RECOVERY: 'true'
          GRAPHDB_GATE_SOAK: ${{ inputs.soak && '1' || '0' }}
        run: scripts/raft_gate.sh
      - name: Validate operational alerts
        run: |
          docker run --rm -v "$PWD/deploy/prometheus/graphdb.rules.yml:/rules.yml:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /rules.yml
      - name: Validate captured diagnostic metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          samples = sorted(Path('artifacts/raft-gate').rglob('*.prom'))
          assert samples, 'deployment gate did not capture diagnostic metrics'
          for sample in samples:
              print(sample, flush=True)
              subprocess.run(['docker', 'run', '--rm', '-i', '--entrypoint', '/bin/promtool',
                  'prom/prometheus:v3.5.0', 'check', 'metrics'], input=sample.read_bytes(), check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raft-gate
          path: artifacts/raft-gate
