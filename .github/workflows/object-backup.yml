name: Object snapshot verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  object-backup:
    name: Object snapshots and fresh-directory restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRAPHDB_BACKUP_GATE_OUTPUT: ${{ github.workspace }}/artifacts/object-backup-gate
      GRAPHDB_TEST_BACKUP_S3_ENDPOINT: http://127.0.0.1:39090
      GRAPHDB_TEST_BACKUP_S3_BUCKET: graphdb-backups
      GRAPHDB_TEST_BACKUP_S3_ACCESS_KEY_ID: graphdb-test
      GRAPHDB_TEST_BACKUP_S3_SECRET_ACCESS_KEY: graphdb-backup-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run isolated MinIO backup gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GRAPHDB_BACKUP_GATE_OUTPUT" "$RUNNER_TEMP/backup-tools"
          for item in minio:RELEASE.2025-09-07T16-13-09Z mc:RELEASE.2025-08-13T08-35-41Z; do
            tool="${item%%:*}"
            version="${item#*:}"
            asset="${tool}.linux-amd64.${version}"
            url="https://github.com/minio/${tool}/releases/download/${version}/${asset}"
            curl -fL --retry 3 "$url" -o "$RUNNER_TEMP/backup-tools/$tool"
            curl -fL --retry 3 "$url.sha256sum" -o "$RUNNER_TEMP/backup-tools/$tool.sha256"
            hash="$(awk '{print $1}' "$RUNNER_TEMP/backup-tools/$tool.sha256")"
            printf '%s  %s\n' "$hash" "$RUNNER_TEMP/backup-tools/$tool" | sha256sum -c -
            chmod +x "$RUNNER_TEMP/backup-tools/$tool"
          done
          MINIO_ROOT_USER=graphdb-test MINIO_ROOT_PASSWORD=graphdb-backup-test-only \
            "$RUNNER_TEMP/backup-tools/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:39090 >"$GRAPHDB_BACKUP_GATE_OUTPUT/minio.log" 2>&1 &
          minio_pid=$!
          trap 'kill "$minio_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 2 \
            http://127.0.0.1:39090/minio/health/ready
          MC_HOST_test=http://graphdb-test:graphdb-backup-test-only@127.0.0.1:39090 \
            "$RUNNER_TEMP/backup-tools/mc" mb test/graphdb-backups
          scripts/object_backup_gate.sh

      - name: Preserve backup verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-backup-gate
          path: |
            ${{ env.GRAPHDB_BACKUP_GATE_OUTPUT }}/*.log
            ${{ env.GRAPHDB_BACKUP_GATE_OUTPUT }}/*.json
