services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/graphdb;
      "

  graphdb:
    build: .
    depends_on:
      - create-bucket
    environment:
      GRAPHDB_ADDR: ":8080"
      GRAPHDB_MODE: all
      GRAPHDB_INSTANCE_ID: graphdb-all
      GRAPHDB_DATA_DIR: /var/lib/graphdb
      GRAPHDB_STORAGE: s3
      GRAPHDB_PREFIX: graphdb
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: graphdb
      S3_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "${GRAPHDB_PORT:-8080}:8080"
    volumes:
      - graphdb-data:/var/lib/graphdb

volumes:
  minio-data:
  graphdb-data:
