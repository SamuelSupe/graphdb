services:
  graphdb:
    build: .
    environment:
      GRAPHDB_ADDR: ":8080"
      GRAPHDB_MODE: all
      GRAPHDB_STORAGE: local
      GRAPHDB_COORDINATION: local
      GRAPHDB_DATA_DIR: /var/lib/graphdb
      GRAPHDB_PREFIX: graphdb
      GRAPHDB_INGEST_MODE: "${GRAPHDB_INGEST_MODE:-direct}"
      GRAPHDB_INGEST_WAL_DURABILITY: sync
      GRAPHDB_MAINTENANCE_MAX_BYTES: "${GRAPHDB_MAINTENANCE_MAX_BYTES:-512MiB}"
      GOMEMLIMIT: "${GOMEMLIMIT:-off}"
      GRAPHDB_READER_CACHE_MAX_BYTES: "${GRAPHDB_READER_CACHE_MAX_BYTES:-512MiB}"
      GRAPHDB_WRITE_CACHE_MAX_BYTES: "${GRAPHDB_WRITE_CACHE_MAX_BYTES:-512MiB}"
    mem_limit: "${GRAPHDB_MEMORY_LIMIT:-0}"
    ports:
      - "${GRAPHDB_PORT:-8080}:8080"
    volumes:
      - graphdb-data:/var/lib/graphdb
    stop_grace_period: 60s
volumes:
  graphdb-data:
